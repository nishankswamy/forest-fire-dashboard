<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 986" width="1060" height="986" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<rect width="1060" height="986" fill="#0d1117"/>
<text x="34" y="44" fill="#f0f6fc" font-size="21" font-weight="700">Sensor node wiring — Raspberry Pi 4 + SX1262 LoRa HAT</text>
<text x="34" y="68" fill="#8b949e" font-size="13">One of five identical sensor nodes. The gateway Pi uses the HAT only — no DHT22, MQ-2 or MCP3008.</text>
<rect x="34" y="86" width="11" height="11" rx="2" fill="#f85149"/>
<text x="51" y="96" fill="#8b949e" font-size="12">5V</text>
<rect x="74.4" y="86" width="11" height="11" rx="2" fill="#ffa657"/>
<text x="91.4" y="96" fill="#8b949e" font-size="12">3V3</text>
<rect x="122.0" y="86" width="11" height="11" rx="2" fill="#6e7681"/>
<text x="139.0" y="96" fill="#8b949e" font-size="12">GND</text>
<rect x="169.6" y="86" width="11" height="11" rx="2" fill="#58a6ff"/>
<text x="186.6" y="96" fill="#8b949e" font-size="12">LoRa HAT</text>
<rect x="253.2" y="86" width="11" height="11" rx="2" fill="#3fb950"/>
<text x="270.2" y="96" fill="#8b949e" font-size="12">DHT22</text>
<rect x="315.2" y="86" width="11" height="11" rx="2" fill="#d29922"/>
<text x="332.2" y="96" fill="#8b949e" font-size="12">MQ-2</text>
<rect x="370.0" y="86" width="11" height="11" rx="2" fill="#bc8cff"/>
<text x="387.0" y="96" fill="#8b949e" font-size="12">MCP3008</text>
<rect x="34" y="108" width="366" height="364" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="52" y="128" fill="#f0f6fc" font-size="13" font-weight="700">40-pin header (pins 1–26 shown)</text>
<text x="128" y="156" fill="#c9d1d9" font-size="12" text-anchor="end">3V3</text>
<rect x="134" y="143" width="19" height="18" rx="4" fill="#ffa657" opacity="1"/>
<text x="143.5" y="156" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">1</text>
<rect x="159" y="143" width="19" height="18" rx="4" fill="#f85149" opacity="1"/>
<text x="168.5" y="156" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">2</text>
