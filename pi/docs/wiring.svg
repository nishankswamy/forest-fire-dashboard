<text x="143.5" y="244" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">9</text>
<rect x="159" y="231" width="19" height="18" rx="4" fill="#58a6ff" opacity="1"/>
<text x="168.5" y="244" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">10</text>
<text x="190" y="244" fill="#c9d1d9" font-size="12">GPIO15 RXD</text>
<text x="128" y="266" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO17</text>
<rect x="134" y="253" width="19" height="18" rx="4" fill="#d29922" opacity="1"/>
<text x="143.5" y="266" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">11</text>
<rect x="159" y="253" width="19" height="18" rx="4" fill="#30363d" opacity="0.35"/>
<text x="168.5" y="266" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">12</text>
<text x="190" y="266" fill="#8b949e" font-size="12">GPIO18</text>
<text x="128" y="288" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO27</text>
<rect x="134" y="275" width="19" height="18" rx="4" fill="#58a6ff" opacity="1"/>
<text x="143.5" y="288" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">13</text>
