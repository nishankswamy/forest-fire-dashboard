<text x="168.5" y="288" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">14</text>
<text x="190" y="288" fill="#c9d1d9" font-size="12">GND</text>
<text x="128" y="310" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO22</text>
<rect x="134" y="297" width="19" height="18" rx="4" fill="#58a6ff" opacity="1"/>
<text x="143.5" y="310" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">15</text>
<rect x="159" y="297" width="19" height="18" rx="4" fill="#30363d" opacity="0.35"/>
<text x="168.5" y="310" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">16</text>
<text x="190" y="310" fill="#8b949e" font-size="12">GPIO23</text>
<text x="128" y="332" fill="#c9d1d9" font-size="12" text-anchor="end">3V3</text>
<rect x="134" y="319" width="19" height="18" rx="4" fill="#ffa657" opacity="1"/>
<text x="143.5" y="332" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">17</text>
<rect x="159" y="319" width="19" height="18" rx="4" fill="#30363d" opacity="0.35"/>
<text x="168.5" y="332" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">18</text>
<text x="190" y="332" fill="#8b949e" font-size="12">GPIO24</text>
<text x="128" y="354" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO10 MOSI</text>
<rect x="134" y="341" width="19" height="18" rx="4" fill="#bc8cff" opacity="1"/>
<text x="143.5" y="354" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">19</text>
<rect x="159" y="341" width="19" height="18" rx="4" fill="#6e7681" opacity="1"/>
<text x="168.5" y="354" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">20</text>
<text x="190" y="354" fill="#c9d1d9" font-size="12">GND</text>
<text x="128" y="376" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO9 MISO</text>
<rect x="134" y="363" width="19" height="18" rx="4" fill="#bc8cff" opacity="1"/>
<text x="143.5" y="376" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">21</text>
<rect x="159" y="363" width="19" height="18" rx="4" fill="#30363d" opacity="0.35"/>
<text x="168.5" y="376" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">22</text>
<text x="190" y="376" fill="#8b949e" font-size="12">GPIO25</text>
<text x="128" y="398" fill="#c9d1d9" font-size="12" text-anchor="end">GPIO11 SCLK</text>
<rect x="134" y="385" width="19" height="18" rx="4" fill="#bc8cff" opacity="1"/>
<text x="143.5" y="398" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">23</text>
<rect x="159" y="385" width="19" height="18" rx="4" fill="#bc8cff" opacity="1"/>
