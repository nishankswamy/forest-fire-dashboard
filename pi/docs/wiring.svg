<text x="190" y="398" fill="#c9d1d9" font-size="12">GPIO8 CE0</text>
<text x="128" y="420" fill="#c9d1d9" font-size="12" text-anchor="end">GND</text>
<rect x="134" y="407" width="19" height="18" rx="4" fill="#6e7681" opacity="1"/>
<text x="143.5" y="420" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">25</text>
<rect x="159" y="407" width="19" height="18" rx="4" fill="#30363d" opacity="0.35"/>
<text x="168.5" y="420" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">26</text>
<text x="190" y="420" fill="#8b949e" font-size="12">GPIO7</text>
<text x="52" y="456" fill="#8b949e" font-size="11">Pins 27–40 unused.</text>
<text x="52" y="472" fill="#8b949e" font-size="11">A stacking header is needed to reach these under the HAT.</text>
<rect x="430" y="108" width="596" height="182" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<rect x="430" y="108" width="5" height="182" rx="2.5" fill="#58a6ff"/>
<text x="450" y="134" fill="#58a6ff" font-size="14" font-weight="700">SX1262 868M LoRa HAT  (SKU 16806)</text>
<text x="450" y="153" fill="#8b949e" font-size="11.5">Sits directly on the header. Point-to-point, NOT LoRaWAN.</text>
<text x="450" y="176" fill="#c9d1d9" font-size="12">UART TXD</text>
<text x="1006" y="176" fill="#c9d1d9" font-size="12" text-anchor="end">pin 8   GPIO14</text>
<line x1="450" y1="182" x2="1006" y2="182" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="197" fill="#c9d1d9" font-size="12">UART RXD</text>
<text x="1006" y="197" fill="#c9d1d9" font-size="12" text-anchor="end">pin 10  GPIO15</text>
<line x1="450" y1="203" x2="1006" y2="203" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="218" fill="#c9d1d9" font-size="12">M1</text>
<text x="1006" y="218" fill="#c9d1d9" font-size="12" text-anchor="end">pin 13  GPIO27</text>
<line x1="450" y1="224" x2="1006" y2="224" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="239" fill="#c9d1d9" font-size="12">M0</text>
<text x="1006" y="239" fill="#c9d1d9" font-size="12" text-anchor="end">pin 15  GPIO22</text>
<line x1="450" y1="245" x2="1006" y2="245" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="268" fill="#8b949e" font-size="11">Jumper to position B. REMOVE the M0/M1 caps. Antenna on before power.</text>
<rect x="430" y="306" width="596" height="160" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<rect x="430" y="306" width="5" height="160" rx="2.5" fill="#3fb950"/>
<text x="450" y="332" fill="#3fb950" font-size="14" font-weight="700">DHT22  —  temperature + humidity</text>
<text x="450" y="351" fill="#8b949e" font-size="11.5">DHT_MODE=dht22</text>
<text x="450" y="374" fill="#c9d1d9" font-size="12">VCC</text>
<text x="1006" y="374" fill="#c9d1d9" font-size="12" text-anchor="end">pin 1   3V3</text>
<line x1="450" y1="380" x2="1006" y2="380" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="395" fill="#c9d1d9" font-size="12">DATA</text>
<text x="1006" y="395" fill="#c9d1d9" font-size="12" text-anchor="end">pin 7   GPIO4</text>
<line x1="450" y1="401" x2="1006" y2="401" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="416" fill="#c9d1d9" font-size="12">GND</text>
<text x="1006" y="416" fill="#c9d1d9" font-size="12" text-anchor="end">pin 9   GND</text>
<line x1="450" y1="422" x2="1006" y2="422" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="445" fill="#8b949e" font-size="11">10 kΩ pull-up from DATA to 3V3. Occasional None reads are normal.</text>
<rect x="430" y="482" width="596" height="160" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<rect x="430" y="482" width="5" height="160" rx="2.5" fill="#d29922"/>
<text x="450" y="508" fill="#d29922" font-size="14" font-weight="700">MQ-2  —  smoke / combustible gas</text>
<text x="450" y="527" fill="#8b949e" font-size="11.5">SMOKE_MODE=digital (DO)  or  SMOKE_MODE=adc (AO)</text>
<text x="450" y="550" fill="#c9d1d9" font-size="12">VCC</text>
<text x="1006" y="550" fill="#c9d1d9" font-size="12" text-anchor="end">pin 2   5V</text>
<line x1="450" y1="556" x2="1006" y2="556" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="571" fill="#c9d1d9" font-size="12">DO  (digital mode)</text>
<text x="1006" y="571" fill="#c9d1d9" font-size="12" text-anchor="end">pin 11  GPIO17</text>
<line x1="450" y1="577" x2="1006" y2="577" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="592" fill="#c9d1d9" font-size="12">AO  (adc mode)</text>
<text x="1006" y="592" fill="#c9d1d9" font-size="12" text-anchor="end">MCP3008 CH0</text>
<line x1="450" y1="598" x2="1006" y2="598" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="621" fill="#8b949e" font-size="11">GND to any GND pin. Set the DO trip point with the on-board pot.</text>
<rect x="430" y="658" width="596" height="228" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
<rect x="430" y="658" width="5" height="228" rx="2.5" fill="#bc8cff"/>
<text x="450" y="684" fill="#bc8cff" font-size="14" font-weight="700">MCP3008  —  10-bit ADC on SPI</text>
<text x="450" y="703" fill="#8b949e" font-size="11.5">SMOKE_MODE=adc only. Enable SPI: raspi-config -&gt; Interface Options -&gt; SPI</text>
<text x="450" y="726" fill="#c9d1d9" font-size="12">VDD + VREF</text>
<text x="1006" y="726" fill="#c9d1d9" font-size="12" text-anchor="end">pin 17  3V3</text>
<line x1="450" y1="732" x2="1006" y2="732" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="747" fill="#c9d1d9" font-size="12">AGND + DGND</text>
<text x="1006" y="747" fill="#c9d1d9" font-size="12" text-anchor="end">GND</text>
<line x1="450" y1="753" x2="1006" y2="753" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="768" fill="#c9d1d9" font-size="12">CLK</text>
<text x="1006" y="768" fill="#c9d1d9" font-size="12" text-anchor="end">pin 23  GPIO11 SCLK</text>
<line x1="450" y1="774" x2="1006" y2="774" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="789" fill="#c9d1d9" font-size="12">DOUT</text>
<text x="1006" y="789" fill="#c9d1d9" font-size="12" text-anchor="end">pin 21  GPIO9  MISO</text>
<line x1="450" y1="795" x2="1006" y2="795" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="810" fill="#c9d1d9" font-size="12">DIN</text>
<text x="1006" y="810" fill="#c9d1d9" font-size="12" text-anchor="end">pin 19  GPIO10 MOSI</text>
<line x1="450" y1="816" x2="1006" y2="816" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="831" fill="#c9d1d9" font-size="12">CS</text>
<text x="1006" y="831" fill="#c9d1d9" font-size="12" text-anchor="end">pin 24  GPIO8  CE0</text>
<line x1="450" y1="837" x2="1006" y2="837" stroke="#30363d" stroke-dasharray="2 3"/>
<text x="450" y="852" fill="#c9d1d9" font-size="12">CH0 / CH1</text>
<text x="1006" y="852" fill="#c9d1d9" font-size="12" text-anchor="end">MQ-2 AO / battery divider</text>
<line x1="450" y1="858" x2="1006" y2="858" stroke="#30363d" stroke-dasharray="2 3"/>
<rect x="34" y="926" width="992" height="30" rx="7" fill="#f85149" fill-opacity="0.09" stroke="#f85149"/>
<text x="50" y="946" fill="#f85149" font-size="12" font-weight="700">! 5V hazard:</text>
<text x="152" y="946" fill="#c9d1d9" font-size="12">the MQ-2 runs on 5V and its AO can exceed 3.3V, which will damage the MCP3008. Fit a 2x10 kΩ divider between AO and CH0.</text>
</svg>